[workspace]
members = ["core"]

[package]
name = "tsumugi"
version = "0.1.0"
description = "Tsumugi - Notion 風ローカルノート（教科書 第6部の題材）"
edition = "2024"

[lib]
# Windows でバイナリ名と衝突しないよう _lib を付ける（create-tauri-app の慣例）
name = "tsumugi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# asset: プロトコル（添付画像の表示）には protocol-asset feature が必要
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tsumugi-core = { path = "core" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "tsumugi-core"
version = "0.1.0"
edition = "2024"
description = "Tsumugi のドメイン層。Tauri に依存せず cargo test で検証できる"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
